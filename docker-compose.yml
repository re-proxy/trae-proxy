services:
  trae2api:
    build: .
    container_name: trae2api
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - TW2A_API_KEY=${TW2A_API_KEY:?set TW2A_API_KEY in .env or shell}
      # 登录回调地址：服务器部署必须改成浏览器可达的完整地址（如 https://trae.example.com/authorize），
      # 留空 = http://127.0.0.1:18080/authorize（仅本机浏览器有效）
      - TW2A_CALLBACK_URL=${TW2A_CALLBACK_URL:-}
      - TW2A_CALLBACK_PORT=${TW2A_CALLBACK_PORT:-18080}
      # Work 通道运行模式：auto (智能自动模式，推荐) | native | bridge | disabled
      - TW2A_WORK_MODE=${TW2A_WORK_MODE:-auto}
      - TW2A_WORK_BRIDGE_URL=${TW2A_WORK_BRIDGE_URL:-http://host-gateway:7865}
      - TW2A_WORK_BRIDGE_TOKEN=${TW2A_WORK_BRIDGE_TOKEN:-twbridge-local-7f3a}
    extra_hosts:
      - "host-gateway:host-gateway"
    ports:
      - "7864:7864"
      - "18080:18080"
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
